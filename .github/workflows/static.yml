# The calculator as one static program: musl and LLVM's runtimes built from
# source (.github/scripts/musl-sysroot.sh, cached), every library built from
# cmake-everywhere's ports (CME_SYSTEM=NEVER), all of it compiled as LLVM
# bitcode and optimised as one module at the link (full LTO), every direct
# call that is not recursion inlined there (tools/force-inline). Release.
name: static

on:
  push:
  workflow_dispatch:

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Space and swap for whole-program optimisation
        run: CALCULATOR_SWAP_GB=48 bash .github/scripts/memory.sh
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson python3 nasm pkg-config perl gperf bison flex \
            curl lsb-release software-properties-common gnupg file generate-ninja libexpat1-dev
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y lld-23 llvm-23 llvm-23-dev libclang-rt-23-dev
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          version=4.4.3
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz" -o /tmp/cmake.tar.gz
          sudo tar xzf /tmp/cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"
      # The build machine's wayland-scanner, of the version the wayland port
      # builds (cmake-everywhere's registry): wayland's own cross build (for
      # musl) runs a native one, of its own version, to write its protocol
      # code -- a tool of this machine's, not a library of the program's
      # (Ubuntu's is older, and refused).
      - name: wayland-scanner for the build machine
        run: |
          git clone --quiet --depth 1 --branch 1.26.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          meson setup /tmp/wayland/build /tmp/wayland -Dlibraries=false -Dscanner=true \
            -Ddocumentation=false -Ddtd_validation=false -Dtests=false --prefix=/usr/local
          sudo ninja -C /tmp/wayland/build install
          pkg-config --modversion wayland-scanner
      - name: Compiler identity
        id: compiler
        run: echo "id=$(clang-23 --version | head -1 | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - id: sysroot
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/calculator-musl
          key: calculator-musl-${{ steps.compiler.outputs.id }}-${{ hashFiles('.github/scripts/musl-sysroot.sh') }}
      - name: Build the sysroot (musl, LLVM's runtimes)
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: bash .github/scripts/musl-sysroot.sh "$HOME/.cache/calculator-musl"
      - name: Cache the sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/calculator-musl
          key: ${{ steps.sysroot.outputs.cache-primary-key }}
      - name: The ForceInline pass plugin
        run: |
          cmake -S tools/force-inline -B build/force-inline -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-23 -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          cmake --build build/force-inline
      - name: Configure
        run: |
          cmake -S . -B build/static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/musl-static.cmake" \
            -DCALCULATOR_SYSROOT="$HOME/.cache/calculator-musl" \
            -DCALCULATOR_FORCE_INLINE_PLUGIN="$PWD/build/force-inline/ForceInline.so" \
            -DCALCULATOR_WINDOW=ON \
            -DCME_SYSTEM=NEVER \
            -DCME_STORE_ENABLED=ON -DCME_SOURCES_ENABLED=ON
      - name: Build
        run: cmake --build build/static --target calculator-window -j2
      - name: What was made
        run: |
          file build/static/calculator-window
          ls -l build/static/calculator-window
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-static-x86_64
          path: build/static/calculator-window
